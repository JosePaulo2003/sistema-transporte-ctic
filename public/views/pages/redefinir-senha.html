<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Transportes CTIC</title><link rel="stylesheet" href="../css/recuperar-senha.css"></head>
<body><main class="conteudo"><section class="area-central"><div class="introducao"><h1>Redefinir senha</h1>
<p>Escolha uma senha de 12 a 72 bytes.</p></div><form id="form-redefinir" class="cartao formulario-conta">
<label>Nova senha<input id="nova-senha" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
<label>Confirme a senha<input id="confirmacao-senha" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label>
<button type="submit" class="botao botao-principal">Salvar nova senha</button><a href="index.html">Voltar ao acesso</a>
</form></section></main></body></html>
